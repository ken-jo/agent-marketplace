name: release

# Build every official plugin whose source version has no <name>-v<version>
# tag yet, publish the zip as a release asset of this repository, and open the
# pull request that pins it (design §6.3). Merging that pull request is what
# publishes the version; this workflow only proposes it.
#
# Plugin code runs only in `build`, which holds a read-only token. `publish`
# holds the write token and never installs or runs a plugin: it uploads the
# zip the build job handed over, after checking its hash.
on:
  push:
    branches: [main]
    paths: ["plugins/*/source/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  BUN_VERSION: "1.3.14"

jobs:
  plan:
    # A release is built from main only: its tag must point into main's
    # history, which `release.mjs verify` requires of every pinned version.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned cosign
        run: |
          tools/install-cosign.sh "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP/cosign" >> "$GITHUB_PATH"
      # The tag is the `ref` in sources.json; a commit pin has no bundle and is refused.
      - name: Hold contract, checker and protocol schema to the signed Ave contract bundle
        run: node tools/vendor.mjs verify
      - id: plan
        run: |
          set -euo pipefail
          releases="$(node tools/release.mjs plan --publish)"
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install the pinned cosign
        run: |
          tools/install-cosign.sh "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP/cosign" >> "$GITHUB_PATH"
      - name: Verify this build checkout against the signed release bundle
        run: node tools/vendor.mjs verify
      - name: Build, test and pack in one verified resident process
        id: pack
        env:
          NAME: ${{ matrix.release.name }}
          ASSET: ${{ matrix.release.asset }}
        run: |
          set -euo pipefail
          mkdir -p out
          sha256="$(node tools/release.mjs build "$NAME" "out/$ASSET" --publish)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.release.name }}
          path: out/${{ matrix.release.asset }}
          if-no-files-found: error
      - name: Hand over the hash
        env:
          SHA256: ${{ steps.pack.outputs.sha256 }}
          NAME: ${{ matrix.release.name }}
        run: |
          mkdir -p hash && echo "$SHA256" > "hash/$NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hash-${{ matrix.release.name }}
          path: hash/${{ matrix.release.name }}

  publish:
    # One job for every release, and one pin pull request for all of them:
    # each pin regenerates marketplace.json, so separate pull requests would
    # conflict with each other. If any build failed, nothing is published.
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASES: ${{ needs.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned cosign
        run: |
          tools/install-cosign.sh "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP/cosign" >> "$GITHUB_PATH"
      - name: Verify this publication checkout against the signed release bundle
        run: node tools/vendor.mjs verify
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hash-*
          path: hash
          merge-multiple: true
      - name: Release each zip the build job hashed
        run: |
          jq -r '.[] | [.name, .version, .tag, .asset] | @tsv' <<< "$RELEASES" |
          while IFS=$'\t' read -r name version tag asset; do
            test "$(sha256sum "out/$asset" | cut -d' ' -f1)" = "$(cat "hash/$name")"
            # A release with an asset stays a draft until the upload finishes,
            # and the tag exists only once it is published.
            gh release create "$tag" "out/$asset" --target "$GITHUB_SHA" --title "$name $version" \
              --notes "Built from $GITHUB_SHA by the release workflow. Not published until the pin pull request merges."
          done
      - name: Open the pin pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          git switch -c "$branch"
          titles=""
          while IFS=$'\t' read -r name version asset; do
            node tools/release.mjs pin "$name" "out/$asset" > /dev/null
            git add "plugins/$name/ave-package.json"
            git commit -m "Pin $name $version to its release asset"
            titles="${titles:+$titles, }$name $version"
          done < <(jq -r '.[] | [.name, .version, .asset] | @tsv' <<< "$RELEASES")
          # Each version's commit is the one that pinned it, so the index follows the pins.
          # --pin-versions also turns the import's descriptor-resolved entries into pins.
          node tools/index.mjs --pin-versions
          git add marketplace.json
          git commit -m "Index $titles"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Publish $titles" \
            --body "Pins the release assets built from $GITHUB_SHA. Merge with a merge commit: the index records the pin commits. Merging publishes these versions."
          # A pull request opened with GITHUB_TOKEN triggers no workflow; run the required check on its head.
          gh workflow run validate.yml --ref "$branch"
