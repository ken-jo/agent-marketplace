name: validate

# The required check on main. A merge to main is the publish (design §4.3), so
# everything the app would refuse has to fail here first.
#
# workflow_dispatch exists for the release workflow: a pull request it opens
# with GITHUB_TOKEN does not trigger workflows, so it dispatches this one on
# the pin branch, and the check runs are attached to that branch's head.
#
# The daily run re-downloads every published release and rebuilds the
# vendored app check (design §5.6): a replaced release asset or a vendored
# file its ref no longer produces fails here before an install meets it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  BUN_VERSION: "1.3.14"

jobs:
  marketplace:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Version entries name the commit each package was published at, and
          # the checks compare packages across those commits.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Validate packages, release pins, layout, published versions and credentials
        env:
          GH_TOKEN: ${{ github.token }}
          # A push compares with what main held before it.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        # Downloads each release a descriptor pins differently from the base,
        # checks its hash and holds its plugin.json to the descriptor.
        # The first push to a new repository has an all-zero `before`: verify everything.
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then
            node tools/release.mjs verify
          else
            node tools/release.mjs verify --base "$BASE"
          fi
      - name: Committed index equals the regenerated index
        run: node tools/index.mjs --check
      - name: Repository tool tests
        run: node --test tools/__tests__/tools.test.mjs
      - name: Plugin build helper
        working-directory: tools/plugin-build
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

  plugin-dirs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.list.outputs.dirs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Every extension source and the template, so a new extension is built
      # and tested from its first pull request.
      - id: list
        run: |
          dirs="$(git ls-files 'plugins/*/source/plugin.json' 'templates/extension/plugin.json' | xargs -n1 dirname | jq -R . | jq -cs .)"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  plugin:
    needs: plugin-dirs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.plugin-dirs.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # A plugin reaches the build helper through a link, and the helper
      # resolves its own imports from its own directory.
      - name: Install the build helper
        working-directory: tools/plugin-build
        run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
      - name: Manifest drift checks
        shell: bash
        run: |
          for script in validate:events validate:hostapi; do
            if node -e "process.exit(require('./package.json').scripts?.['$script'] ? 0 : 1)"; then
              bun run "$script"
            fi
          done
      - name: The built entry loads in a bare Node process
        shell: bash
        run: |
          entry="$(node -e "const m=require('./plugin.json');process.stdout.write(m.extensions['ai.agent-connector.ave'].entry)")"
          node --input-type=module -e "
            import('./${entry}').then((m) => console.log('loads:', Object.keys(m).join(', ') || '(no exports)'))
              .catch((e) => { console.error('load failed:', e?.message ?? e); process.exit(1); });
          "

  # local-indexer's Python worker has its own suite (test/*.test.py, pytest.ini
  # owns discovery), run against the runtime lock the plugin ships plus the
  # test-only requirements, on the Python the host installs (3.12).
  local-indexer-python:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/local-indexer/source
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install the runtime lock and the test requirements
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r python-requirements.lock -r python-test-requirements.txt
      - name: Python worker tests
        run: .venv/bin/python -m pytest test/

  # The one check name branch protection requires for the matrix, whose job
  # names change as plugins are added, and for local-indexer's Python suite.
  plugins:
    if: always() && github.event_name != 'schedule'
    needs: [plugin-dirs, plugin, local-indexer-python]
    runs-on: ubuntu-latest
    steps:
      - env:
          LIST: ${{ needs.plugin-dirs.result }}
          BUILD: ${{ needs.plugin.result }}
          PYTHON: ${{ needs.local-indexer-python.result }}
        run: test "$LIST" = success && test "$BUILD" = success && test "$PYTHON" = success

  published:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Every published release still hashes to its pin and matches its source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release.mjs verify --publish
      - name: The vendored app check is what its ave commit builds
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          ref="$(jq -er .ref tools/vendor/sources.json)"
          repository="$(jq -er .repository tools/vendor/sources.json)"
          git clone --quiet --filter=blob:none "https://github.com/${repository}.git" "$RUNNER_TEMP/ave"
          git -C "$RUNNER_TEMP/ave" checkout --quiet "$ref"
          (cd "$RUNNER_TEMP/ave" && bun install --frozen-lockfile --ignore-scripts)
          node tools/vendor.mjs verify --app "$RUNNER_TEMP/ave"
